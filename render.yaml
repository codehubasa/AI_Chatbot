services:
  - type: web
    name: cypher-chatbot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false